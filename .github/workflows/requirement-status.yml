name: requirement-status

# The full suite, including tests for requirements not met yet, so the red or
# green state keeps reporting requirement satisfaction (Lab Manual Ch 3, Ch 5).
# This workflow stays red until those requirements are implemented and verified.

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v
